[package]
name = "pocbot"
version = "1.0.2"
authors = ["Scott Gould <greysilly7@gmail.com>"]
edition = "2021"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.89"
dotenv = "0.15.0"
poise = "0.6.1"
tokio = { version = "1.32.0", features = ["macros", "rt-multi-thread"] }
log = "0.4.22"
async-minecraft-ping = "0.8.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[profile.dev.package."*"]
opt-level = 3
